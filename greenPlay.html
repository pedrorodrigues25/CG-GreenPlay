<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenPlay</title>

    <!-- Bibliotecas externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <div id="gameover">
            <h1>GAME OVER</h1>
            <div class="status">
                <div>Pontos: <span id="final-pontos">0</span></div>
                <div>Desperdício: <span id="final-desperdicio">0</span></div>
                <div>Nível do Solo: <span id="final-nivel">0</span></div>
                <button id="reloadBtn" onclick="location.reload()">Jogar Novamente</button>
                <button onclick="window.location.href='/learn.html'">Finalizar</button>
            </div>
        </div>

        <script>
            let p5Canvas, ctx;

            // ml5
            let video, faceMesh, faces = [];

            // objetos do jogo
            let objetos = [], animacoes = [], lixoPilha = [];

            // pontuação
            let pontos = 0, desperdicio = 0, nivelSolo = 0;

            // dimensões do canva e do vídeo
            const canvasW = 1500, canvasH = 900;
            const videoW = 500, videoH = 725;

            // dimensões e posição do "lixo" no jogo
            const lixoX = 600, lixoY = 500, lixoW = 230, lixoH = 230;

            // imagens
            let fundo, trashBack, trashImg;
            let imagensAlimento = [], imagensCompostagem = [], imagensLixo = [];

            // opções para a detecção de rosto
            const options = { maxFaces: 1, refineLandmarks: false, flipHorizontal: true };

            // variáveis das folhas e cores
            let folhas = []; 
            let tonalidadeBase = 140;
            let ultimoNivelSolo = 0;

            // carrega as imagens e inicializa o ml5
            function preload() {
                faceMesh = ml5.faceMesh(options);

                fundo = loadImage("images/background.png");
                fundoGO = loadImage("images/backgroundGameOver.png")
                trashBack = loadImage("images/trashBack.png");
                trashImg = loadImage("images/trash.png");

                // imagens de alimentos e compostagem
                for (let i = 1; i <= 3; i++) {
                    loadImage("images/alimento" + i + ".png", img => imagensAlimento.push(img));
                    loadImage("images/compostagem" + i + ".png", img => imagensCompostagem.push(img));
                }
                // imagens de lixo
                for (let i = 1; i <= 4; i++) {
                    loadImage("images/lixo" + i + ".png", img => imagensLixo.push(img));
                }
            }

            function setup() {
                createCanvas(canvasW, canvasH);
                ctx = drawingContext;

                video = createCapture(VIDEO);
                video.size(videoW, videoH);
                video.hide();

                faceMesh.detectStart(video, gotFaces);

                for (let i = 0; i < 4; i++) criaObjeto();
                setInterval(criaObjeto, 2000);
            }

            function draw() {
                background(200);

                // fundo principal
                if (fundo) image(fundo, canvasW/2, canvasH/2, canvasW, canvasH);

                // espelha e desenha vídeo
                push();
                translate(videoW, 0);
                scale(-1, 1);
                image(video, 225, 375, videoW, videoH);
                pop();

                // contorno do vídeo
                noFill();
                stroke(100);
                rect(25, 12, videoW, videoH);

                // lixeira de fundo
                if (trashBack) image(trashBack, 750, 700, lixoW, lixoH);

                imageMode(CENTER);

                // objetos na pilha de lixo
                const centerX = 733;
                const baseStart = 770;
                for (let i = 0; i < lixoPilha.length; i++) {
                    const item = lixoPilha[i];
                    const y = baseStart - i * 20;
                    if (item.img)
                        image(item.img, centerX, y, 60, 60);
                    else
                        drawPlaceholder(centerX, y, 40, item.id);
                }

                // lixeira frontal
                if (trashImg) image(trashImg, 750, 700, lixoW, lixoH);

                // objetos caindo
                for (let obj of objetos) {
                    push();
                    translate(obj.x, obj.y);
                    rotate(obj.rot);
                    if (obj.img) image(obj.img, 0, 0, 90, 90);
                    else drawPlaceholder(0, 0, 48, obj.id);
                    pop();
                    obj.y += obj.vel;
                    obj.rot += 0.02;
                }

                // desenha os objetos "voando" para a lixeira
                for (let i = animacoes.length - 1; i >= 0; i--) {
                    const a = animacoes[i];
                    a.progress += 0.03;
                    const t = constrain(a.progress, 0, 1);
                    const x = lerp(a.x0, a.x1, t);
                    const y = lerp(a.y0, a.y1, t) - sin(t * PI) * 80;
                    const rot = a.angulo + t * TWO_PI;
                    push();
                    translate(x, y);
                    rotate(rot);
                    imageMode(CENTER);
                    if (a.img) image(a.img, 0, 0, 50, 50);
                    else drawPlaceholder(0, 0, 48, a.id);
                    pop();

                    // coloca o objeto na pilha de lixo
                    if (t >= 1) {
                        lixoPilha.push({ img: a.img, id: a.id });
                        if (a.id === "ob_lixo") pontos += 10;
                        else desperdicio += 15;
                        animacoes.splice(i, 1);
                    }
                }

                // Detecta a boca para "comer" objetos
                if (faces.length > 0 && faces[0].lips) {
                    const lips = faces[0].lips;

                    if (!this.lipsSuave) this.lipsSuave = { x: lips.x, y: lips.y, w: lips.width, h: lips.height };
                    this.lipsSuave.x = lerp(this.lipsSuave.x, lips.x, 0.2);
                    this.lipsSuave.y = lerp(this.lipsSuave.y, lips.y, 0.2);
                    this.lipsSuave.w = lerp(this.lipsSuave.w, lips.width, 0.2);
                    this.lipsSuave.h = lerp(this.lipsSuave.h, lips.height, 0.2);

                    const lx = this.lipsSuave.x;
                    const ly = this.lipsSuave.y;
                    const lw = this.lipsSuave.w;
                    const lh = this.lipsSuave.h;

                    // contorno da boca
                    noFill();
                    stroke(0, 255, 0);
                    strokeWeight(3);
                    rect(lx + 20, ly, lw, lh);

                    // contato com objetos
                    for (let i = objetos.length - 1; i >= 0; i--) {
                        const obj = objetos[i];
                        if (obj.x > lx && obj.x < lx + lw && obj.y > ly && obj.y < ly + lh) {
                            if (obj.id === "ob_alimento") {
                                pontos += 10;
                            } else if (obj.id === "ob_compostagem" || obj.id === "ob_lixo") {
                                gameOver();
                            }
                            objetos.splice(i, 1);
                        }
                    }
                }


                // remove objetos que saem da tela e atualiza o nível
                for (let i = objetos.length - 1; i >= 0; i--) {
                    const obj = objetos[i];
                    if (obj.y > videoH + 20) {
                        if (obj.id === "ob_compostagem") nivelSolo++;
                        if (obj.id === "ob_lixo") nivelSolo--;
                        if (obj.id === "ob_alimento") desperdicio += 15;
                        objetos.splice(i, 1);
                    }
                }

                atualizarCoresFolhas();
                mostraHUD();
                desenharArvore();
            }

            // recebe os resultados da detecção facial
            function gotFaces(results) { faces = results; }

            // cria os novos objetos aleatórios
            function criaObjeto() {
                const tipos = [
                    { id: "ob_alimento", lista: imagensAlimento },
                    { id: "ob_compostagem", lista: imagensCompostagem },
                    { id: "ob_lixo", lista: imagensLixo },
                ];
                const tipo = random(tipos);
                objetos.push({
                    id: tipo.id,
                    img: random(tipo.lista),
                    x: random(videoW - 40) + 40,
                    y: 0,
                    vel: random(1.5, 3),
                    rot: random(TWO_PI),
                });
            }

            // chama a função ao clicar com o mouse
            function mousePressed() {
                for (let i = objetos.length - 1; i >= 0; i--) {
                    const obj = objetos[i];
                    const d = dist(mouseX, mouseY, obj.x, obj.y);
                    if (d < 30) {
                        jogaNoLixoAnimado(obj);
                        objetos.splice(i, 1);
                        break;
                    }
                }
            }

            // anima o objeto indo pra lixeira
            function jogaNoLixoAnimado(obj) {
                const destinoX = lixoX + lixoW / 2;
                const destinoY = lixoY + lixoH - 100;
                animacoes.push({
                    img: obj.img,
                    id: obj.id,
                    x0: obj.x,
                    y0: obj.y,
                    x1: destinoX,
                    y1: destinoY,
                    progress: 0,
                    angulo: random(TWO_PI),
                });
            }

            // mostra pontuação e nível na tela
            function mostraHUD() {
                noStroke();
                fill(0);
                textSize(24);
                textAlign(LEFT);
                text(`Pontos: ${pontos}`, 30, 40);
                text(`Desperdício: ${desperdicio}`, 30, 70);
                text(`Nível do Solo: ${nivelSolo}`, 30, 100);
            }

            // exibe a tela de game over
            function gameOver() {
                noLoop();
                background(200);
                if (fundo) image(fundoGO, canvasW/2, canvasH/2, canvasW, canvasH);
                document.getElementById("final-pontos").textContent = pontos;
                document.getElementById("final-desperdicio").textContent = desperdicio;
                document.getElementById("final-nivel").textContent = nivelSolo;
                document.getElementById("gameover").style.display = "block";
            }

            // atualiza as cores das folhas do jogo
            function atualizarCoresFolhas() {
                if (nivelSolo > ultimoNivelSolo) {
                    tonalidadeBase = (tonalidadeBase + 10) % 255;
                    folhas = [];
                    for (let i = 0; i < 400; i++) {
                        folhas.push({
                            x: random(800, 1000),
                            y: random(200, 500),
                            r: 0,
                            g: tonalidadeBase + random(30),
                            b: 0
                        });
                    }
                    cacheFolhas = [...folhas];
                } else if (nivelSolo < ultimoNivelSolo) {
                    for (let i = 0; i < folhas.length; i++) {
                        if (random() < 0.05) {
                            folhas[i] = { 
                                ...folhas[i],
                                r: 180 + random(40), 
                                g: 120 + random(40), 
                                b: 0 
                            };
                        }
                    }
                }
                ultimoNivelSolo = nivelSolo;
            }

            // árvore e folhas em formato de gota
            function desenharGotaLateral(x, y, angulo, lado = 1) {
                const gotaComprimento = 50;
                const gotaLargura = 40;
                const deslocamento = 20 * lado;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate((-angulo * Math.PI) / 180);
                ctx.translate(deslocamento, 0);
                const folha = folhas[int(random(folhas.length))];
                if (folha) {
                    ctx.fillStyle = `rgb(${folha.r}, ${folha.g}, ${folha.b})`;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(gotaLargura / 2, -gotaComprimento / 2, 0, -gotaComprimento);
                    ctx.quadraticCurveTo(-gotaLargura / 2, -gotaComprimento / 2, 0, 0);
                    ctx.fill();
                }
                ctx.restore();
            }

            // desenha os galhos
            function desenharGalho(galho) {
                const { x, y, comprimento, angulo, largura } = galho;
                const x2 = x + comprimento * Math.cos((angulo * Math.PI) / 180);
                const y2 = y - comprimento * Math.sin((angulo * Math.PI) / 180);
                const corGalho = comprimento < 10 ? "#0B4019" : "#382117";

                if (corGalho === "#382117") {
                    ctx.lineWidth = largura + 12;
                    ctx.strokeStyle = "#21140E";
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }

                ctx.lineWidth = largura;
                ctx.strokeStyle = corGalho;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                if (comprimento < 30) {
                    desenharGotaLateral(x2, y2, angulo, -1);
                    desenharGotaLateral(x2, y2, angulo, 1);
                }

                return { x2, y2 };
            }

            let cacheGalhos = [];
            let cacheNivel = -1;
            let folhasFixas = [];
            let ultimaCorBase = 140;

            // atualiza as folhas e cores se o nível mudar
            function atualizarFolhasSeNecessario() {
                const corBase = 140 + nivelSolo * 5;
                if (nivelSolo !== cacheNivel) {
                    if (nivelSolo > cacheNivel) {
                        folhasFixas = [];
                        for (let i = 0; i < 200; i++) {
                            folhasFixas.push({
                                x: random(-60, 60),
                                y: random(-200, -30),
                                r: 0,
                                g: constrain(corBase + random(-10, 20), 0, 255),
                                b: 0,
                            });
                        }
                    } else if (nivelSolo < cacheNivel) {
                        for (let i = 0; i < folhasFixas.length; i++) {
                            if (random() < 0.05) {
                                folhasFixas[i].r = 180 + random(40);
                                folhasFixas[i].g = 120 + random(40);
                                folhasFixas[i].b = 0;
                            }
                        }
                    }
                    cacheNivel = nivelSolo;
                }
            }

            // desenha a árvore
            function desenharArvore() {
                atualizarFolhasSeNecessario();

                const nivelAtual = Math.floor(nivelSolo / 3);
                if (nivelAtual !== cacheNivel || cacheGalhos.length === 0) {
                    cacheGalhos = [];
                    const base = { x: 1100, y: 800 };
                    let galhos = [
                        { x: base.x, y: base.y, comprimento: 80, angulo: 90, largura: 20, nivel: 0 },
                    ];
                    for (let n = 0; n <= nivelAtual; n++) {
                        let novosGalhos = [];
                        for (const galho of galhos) {
                            const ponta = desenharGalho(galho);
                            if (n < nivelAtual) {
                                const separacao = 40;
                                const angEsq = galho.angulo + separacao / 2;
                                const angDir = galho.angulo - separacao / 2;
                                const novoComprimento = galho.comprimento * 0.7;
                                const novaLargura = Math.max(2, galho.largura * 0.7);

                                novosGalhos.push({
                                    x: ponta.x2,
                                    y: ponta.y2,
                                    comprimento: novoComprimento,
                                    angulo: angEsq,
                                    largura: novaLargura,
                                    nivel: galho.nivel + 1,
                                });
                                novosGalhos.push({
                                    x: ponta.x2,
                                    y: ponta.y2,
                                    comprimento: novoComprimento,
                                    angulo: angDir,
                                    largura: novaLargura,
                                    nivel: galho.nivel + 1,
                                });
                            }
                            
                            cacheGalhos.push(galho);
                        }
                        galhos = novosGalhos;
                    }
                }

                for (const g of cacheGalhos) desenharGalho(g);
            }
        </script>
    </body>
</html>
