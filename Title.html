<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <title>Banner</title>

    <style>
        body {
            font-family: "Jersey 10", sans-serif;
            background-color:aquamarine;
            font-family: "Jersey 10", sans-serif;
            background-color: aquamarine;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrollbars */
        }              
            
        #myCanvas {
            position: fixed; /* Changed from absolute to fixed */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Center the canvas */
            z-index: -1; /* Put canvas behind other elements */
            border: 2px solid #333;
        }
        
        .banner {
            color: white;
            font-size: 200px;
            margin: 400px auto;
            margin-bottom: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; /* Ensure it stays above canvas */
            z-index: 1;
        
            width: 800px;
            height: 140px;
            background: #103D10;
            clip-path: polygon(
                8px 0, calc(100% - 8px) 0,
                calc(100% - 8px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px),
                calc(100% - 8px) 100%, 8px 100%,
                8px calc(100% - 8px), 0 calc(100% - 8px),
                0 8px, 8px 8px
            );
        }
            
            
        #play_btn {
            background-image: url(testImages/playBtn.png);
            width: 250px;
            height: 90px;
            font-family: "Jersey 10", sans-serif;
            color: #103D10;
            font-size: 80px;
            margin: 50px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            background-color: transparent;
            position: relative; /* Ensure it stays above canvas */
            z-index: 1;
            transition: transform 0.3s ease-in-out; /* Keep transition here */
        }
        

        

        #play_btn {
            background-image: url(testImages/playBtn.png);
            width: 250px;
            height: 90px;
            font-family: "Jersey 10", sans-serif;
            color: #103D10;
            font-size: 80px;
            margin: 50px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            background-color: transparent;
        }

        @keyframes rotate-in {
                0% {
                    rotate: 0deg;
                }
                100% {
                    rotate: -5deg;
            
           }
        }

        @keyframes rotate-out {
            0% {
                transform: scale(1.1) rotate(0deg);
            }
            100% {
                transform: scale(0) rotate(-360deg);
            }
        }

        #play_btn:hover{
            transform: scale(1.1) rotate(-5deg);
        }


        #play_btn:active{
            transform: scale(1.1) translateY(0);
        }

        .play-btn-after-click{
            transform: scale(1);
            transition: none; 
        }



        .play-btn-clicked{
            animation: rotate-out 1s forwards ease-out !important;
            transition: none !important; /* Disable transition during animation */
        }
        
             
        
    </style>
</head>
<body>
    
    <div class="banner">GREENPLAY</div>
    <button id="play_btn">JOGAR</button>
    <canvas id="myCanvas" class="myCanvas" width="1500" height="900"></canvas>

    <script>
        const canvas = document.getElementById('myCanvas')
        const ctx = canvas.getContext('2d')
        const W = canvas.width , H = canvas.height

        // Move images to global scope
        let imgArvores = new Image()
        let imgCeu = new Image() 
        let imgNuvens = new Image()
        let nuvensX = 0

        function drawLandingPage(){
            ctx.clearRect(0, 0, canvas.width, canvas.height)

            imgArvores.src = 'assets/img/arvores.png'
            imgCeu.src = '/assets/img/ceu.png'
            imgNuvens.src = '/assets/img/nuvens.png'

            imgCeu.onload = function() {
                // Start animation after sky loads
                setInterval(render, 1000/24)
            }
        }

        function render(){
            // Clear canvas
            ctx.clearRect(0, 0, W, H)
            
            // Draw layers in order: sky, clouds, trees
            ctx.drawImage(imgCeu, 0, 0, W, H)
            
            // Draw moving clouds
            ctx.drawImage(imgNuvens, nuvensX, 0, W, H)
            ctx.drawImage(imgNuvens, nuvensX - W, 0, W, H)
            
            ctx.drawImage(imgArvores, 0, 0, W, H)
            
            // Update cloud position
            nuvensX += 2
            if (nuvensX >= W) {
                nuvensX = 0
            }
 
        }

        drawLandingPage()

        //Evento do botão de jogar
        const playButton = document.getElementById('play_btn');
        playButton.addEventListener('click', (e) => {
            e.preventDefault();
            playButton.classList.add('play-btn-clicked');
            setTimeout(() => {
                window.location.href = '/finalTest.html';
            }, 1000); // Tempo para a animação completar
        });

        playButton.addEventListener('animationend', () => {
            playButton.classList.remove('play-btn-clicked');
        });

    </script>
</body>
</html>
