<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <title>Banner</title>

    <style>
        body {
            font-family: "Jersey 10", sans-serif;
            background-color:aquamarine;
        }

        .banner {
            color: white;
            font-size: 200px;
            margin: 400px auto;
            margin-bottom: 0px;
            display: flex;
            justify-content: center;
            align-items: center;

            width: 800px;
            height: 140px;
            background: #103D10;
            clip-path: polygon(
                8px 0, calc(100% - 8px) 0,
                calc(100% - 8px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px),
                calc(100% - 8px) 100%, 8px 100%,
                8px calc(100% - 8px), 0 calc(100% - 8px),
                0 8px, 8px 8px
            );
        }

        #play_btn {
            background-image: url(testImages/playBtn.png);
            width: 250px;
            height: 90px;
            font-family: "Jersey 10", sans-serif;
            color: #103D10;
            font-size: 80px;
            margin: 50px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            background-color: transparent;
        }

        #play_btn:hover{
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5)
        }

        #play_btn::before{
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                0deg, 
                transparent, 
                transparent 30%, 
                rgba(0,255,255,0.3)
            );
            transform: rotate(-45deg);
            transition: all 0.5s ease;
            opacity: 0;
        }

        #play_btn::before:hover{
            opacity: 1;
            transform: rotate(-45deg) translateY(100%);
        }
             
        
    </style>
</head>
<body>
    <script>
        const canvas = document.getElementById('myCanvas')
        const ctx = canvas.getContext('2d')
        const W = canvas.width , H = canvas.height

        // Move images to global scope
        let imgArvores = new Image()
        let imgCeu = new Image() 
        let imgNuvens = new Image()
        let playBtn = new Image()
        let imgLogo = new Image()
        let nuvensX = 0

        function drawLandingPage(){
            ctx.clearRect(0, 0, canvas.width, canvas.height)

            imgArvores.src = 'assets/img/arvores.png'
            imgCeu.src = '/assets/img/ceu.png'
            imgNuvens.src = '/assets/img/nuvens.png'
            playBtn.src = '/assets/img/PlayButton.svg'
            imgLogo.src = '/assets/img/Logo.svg'

            imgCeu.onload = function() {
                // Start animation after sky loads
                setInterval(render, 1000/24)
            }
        }

        function render(){
            // Clear canvas
            ctx.clearRect(0, 0, W, H)
            
            // Draw layers in order: sky, clouds, trees
            ctx.drawImage(imgCeu, 0, 0, W, H)
            
            // Draw moving clouds
            ctx.drawImage(imgNuvens, nuvensX, 0, W, H)
            ctx.drawImage(imgNuvens, nuvensX - W, 0, W, H)
            
            ctx.drawImage(imgArvores, 0, 0, W, H)
            
            // Update cloud position
            nuvensX += 2
            if (nuvensX >= W) {
                nuvensX = 0
            }

            ctx.drawImage(imgLogo, W/2 - 392.5, 270)
            ctx.drawImage(playBtn, W/2 - 157, 600) 
            
        }

        drawLandingPage()

    </script>

    <div class="banner">GREENPLAY</div>
    <button id="play_btn">JOGAR</button>
</body>
</html>
